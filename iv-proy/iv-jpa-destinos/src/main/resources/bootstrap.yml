server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: iv-jpa-destinos
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://config-server:8888}
      username: ${CONFIG_SERVER_USERNAME:iv-admin}
      password: ${CONFIG_SERVER_PASSWORD:iv-admin}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka:8761/eureka/}

encrypt:
  key: ${ENCRYPT_KEY:}