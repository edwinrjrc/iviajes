server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: iv-service-viajes
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      username: ${CONFIG_SERVER_USERNAME:iv-admin}
      password: ${CONFIG_SERVER_PASSWORD:iv-admin}
      fail-fast: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}